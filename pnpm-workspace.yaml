# Without it the Worker bundle picks up sqlite-wasm for Nuxt Content, BigInt literals and all.
shamefullyHoist: true

allowBuilds:
  # Docus still drags it in as a peer. Nothing loads it.
  better-sqlite3: false
  esbuild: true
  workerd: true
  vue-demi: true

catalogs:
  deps:
    docus: 5.15.0
    nuxt: 4.6.4
  dev:
    "@iconify-json/lucide": 1.2.157
    "@iconify-json/simple-icons": 1.2.103
    "@iconify-json/vscode-icons": 1.2.99
    wrangler: 4.128.0

cleanupUnusedCatalogs: true

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
